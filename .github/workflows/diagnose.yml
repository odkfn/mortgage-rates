name: Diagnose the scrape

# Temporary. Dumps the filtered rates table's structure - headers, cells, and
# the markup of one cell - so the parser can be taught the real column layout.
# Delete once the parser reads the live page again.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Dump the filtered table
        run: |
          python - <<'PY'
          import pathlib
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          URL = "https://mortgages.firstdirect.com/mortgage-rates/list-rates"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")
          FILTER = {
              "rates_filter[buyerType]": "RM",
              "rates_filter[mortgageType]": "repayment",
              "rates_filter[rateType]": "Fixed",
          }

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(user_agent=UA, locale="en-GB")
              page.goto(URL, wait_until="networkidle", timeout=60_000)
              el = page.query_selector("#consent_prompt_decline")
              if el:
                  try:
                      el.click(timeout=5000)
                  except Exception:
                      pass
              for name, value in FILTER.items():
                  page.select_option(f"select[name='{name}']", value)
              page.click("#rates_filter_submit")
              page.wait_for_load_state("networkidle", timeout=60_000)
              page.wait_for_timeout(3000)
              html = page.content()
              browser.close()

          pathlib.Path("filtered.html").write_text(html)
          soup = BeautifulSoup(html, "html.parser")
          table = soup.find("table")
          print("table attrs:", dict(table.attrs) if table else None)

          print("=" * 70)
          print("CAPTION / PRECEDING HEADINGS")
          if table:
              cap = table.find("caption")
              print("  caption:", (cap.get_text(' ', strip=True)[:200] if cap else None))
              prev = table.find_previous(["h1", "h2", "h3", "h4"])
              print("  previous heading:", (prev.get_text(' ', strip=True)[:120] if prev else None))

          print("=" * 70)
          print("HEADER CELLS")
          for i, th in enumerate(table.find_all("th")[:15]):
              print(f"  [{i}] {th.get_text(' ', strip=True)[:110]!r}")

          print("=" * 70)
          print("FIRST 4 BODY ROWS, CELL BY CELL")
          rows = table.find_all("tr")
          shown = 0
          for r in rows:
              cells = r.find_all(["td", "th"])
              if len(cells) < 2:
                  continue
              print(f"  --- row with {len(cells)} cells")
              for i, c in enumerate(cells):
                  full = c.get_text(" ", strip=True)
                  # what the text looks like once obvious tooltip markup is dropped
                  clone = BeautifulSoup(str(c), "html.parser")
                  for junk in clone.select(
                      "[class*=tooltip], [class*=more-info], [class*=moreinfo], "
                      "[class*=accordion], [class*=hidden], [class*=visually], details, dialog"
                  ):
                      junk.decompose()
                  stripped = clone.get_text(" ", strip=True)
                  print(f"    [{i}] raw={full[:80]!r}")
                  if stripped != full:
                      print(f"         stripped={stripped[:80]!r}")
              shown += 1
              if shown >= 4:
                  break

          print("=" * 70)
          print("MARKUP OF ONE NAME-ISH CELL")
          for r in rows:
              cells = r.find_all("td")
              if cells:
                  print(str(cells[0])[:2500])
                  break
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filtered-html
          path: filtered.html
          if-no-files-found: ignore
          retention-days: 7
