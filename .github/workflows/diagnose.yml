name: Capture a live fixture

# Temporary. Submits the rates filter in a browser and commits the resulting
# rates table into tests/fixtures/ so the parser can be developed against real
# markup. Delete once the fixture is captured and the parser reads it.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Capture the filtered table
        run: |
          python - <<'PY'
          import pathlib
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          URL = "https://mortgages.firstdirect.com/mortgage-rates/list-rates"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")
          FILTER = {
              "rates_filter[buyerType]": "RM",
              "rates_filter[mortgageType]": "repayment",
              "rates_filter[rateType]": "Fixed",
          }

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(user_agent=UA, locale="en-GB")
              page.goto(URL, wait_until="networkidle", timeout=60_000)
              el = page.query_selector("#consent_prompt_decline")
              if el:
                  try:
                      el.click(timeout=5000)
                  except Exception:
                      pass
              for name, value in FILTER.items():
                  page.select_option(f"select[name='{name}']", value)
              page.click("#rates_filter_submit")
              page.wait_for_load_state("networkidle", timeout=60_000)
              page.wait_for_timeout(3000)
              html = page.content()
              browser.close()

          soup = BeautifulSoup(html, "html.parser")
          table = soup.find("table")
          if table is None:
              raise SystemExit("no table on the filtered page - nothing captured")

          rows = [r for r in table.find_all("tr") if len(r.find_all(["td", "th"])) > 1]
          print(f"captured a table with {len(rows)} rows")

          out = pathlib.Path("tests/fixtures/live_filtered_table.html")
          out.write_text(
              "<!-- Captured from the live first direct rates page after submitting\n"
              "     rates_filter: buyerType=RM, mortgageType=repayment, rateType=Fixed.\n"
              "     Real markup - do not hand-edit. -->\n"
              "<html><body>\n" + str(table) + "\n</body></html>\n"
          )
          print(f"wrote {out} ({out.stat().st_size:,} bytes)")
          PY

      - name: Commit the fixture
        run: |
          git config user.name "mortgage-rate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/live_filtered_table.html
          if git diff --cached --quiet; then
            echo "fixture unchanged"
          else
            git commit -m "Capture the live filtered rates table as a fixture"
            git push
          fi
