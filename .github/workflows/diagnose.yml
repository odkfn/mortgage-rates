name: Diagnose the scrape

# Temporary. The rates only appear after choosing mortgage type / rate type /
# repayment type on the page, so this dumps the form controls and the network
# calls the page makes, to work out what to drive and what to wait for.
# Delete once the parser reads the live page again.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Dump the form controls and network traffic
        run: |
          python - <<'PY'
          import json, re
          from playwright.sync_api import sync_playwright

          URL = "https://mortgages.firstdirect.com/mortgage-rates/list-rates"
          calls = []

          def note(response):
              try:
                  ct = response.headers.get("content-type", "")
              except Exception:
                  return
              if "json" in ct or re.search(r"/api/|rates|product", response.url, re.I):
                  calls.append((response.status, ct.split(";")[0], response.url))

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                             "(KHTML, like Gecko) Chrome/126.0 Safari/537.36",
                  locale="en-GB",
              )
              page.on("response", note)
              page.goto(URL, wait_until="networkidle", timeout=60_000)
              page.wait_for_timeout(4000)

              print("=" * 70)
              print("final url:", page.url)
              print("percentages in DOM right now:",
                    len(re.findall(r"\d+\.\d+\s*%", page.inner_text("body"))))

              print("=" * 70)
              print("SELECTS")
              for sel in page.query_selector_all("select"):
                  name = sel.get_attribute("name") or sel.get_attribute("id") or "?"
                  opts = [(o.get_attribute("value"), (o.inner_text() or "").strip())
                          for o in sel.query_selector_all("option")]
                  print(f"  select name/id={name!r}")
                  for value, label in opts[:20]:
                      print(f"      value={value!r} label={label!r}")

              print("=" * 70)
              print("RADIO / CHECKBOX INPUTS")
              for inp in page.query_selector_all("input[type=radio], input[type=checkbox]"):
                  iid = inp.get_attribute("id")
                  label = ""
                  if iid:
                      lab = page.query_selector(f"label[for='{iid}']")
                      if lab:
                          label = (lab.inner_text() or "").strip()
                  print(f"  type={inp.get_attribute('type')!r} name={inp.get_attribute('name')!r} "
                        f"id={iid!r} value={inp.get_attribute('value')!r} label={label!r}")

              print("=" * 70)
              print("BUTTONS / SUBMITS")
              for b in page.query_selector_all("button, input[type=submit], a[role=button]"):
                  text = (b.inner_text() or "").strip().replace("\n", " ")
                  if text:
                      print(f"  <{b.evaluate('e => e.tagName.toLowerCase()')}> "
                            f"id={b.get_attribute('id')!r} text={text[:60]!r}")

              print("=" * 70)
              print("HEADINGS")
              for h in page.query_selector_all("h1, h2, h3")[:25]:
                  t = (h.inner_text() or "").strip().replace("\n", " ")
                  if t:
                      print(f"  {t[:90]!r}")

              browser.close()

          print("=" * 70)
          print("INTERESTING NETWORK CALLS")
          for status, ct, url in calls[:40]:
              print(f"  {status} {ct:24} {url[:160]}")
          PY
