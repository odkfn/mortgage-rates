name: Diagnose the scrape

# Temporary. The rates appear only after the rates_filter form is submitted.
# This tries both routes — driving the form in a browser, and a plain GET with
# the filter as query parameters — and reports which yields parseable rates.
# Delete once the parser reads the live page again.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install --with-deps chromium

      - name: Submit the filter, both ways
        run: |
          python - <<'PY'
          import re, pathlib, requests
          from urllib.parse import urlencode
          from playwright.sync_api import sync_playwright
          from tracker.scrape import parse_products, ParseError

          URL = "https://mortgages.firstdirect.com/mortgage-rates/list-rates"
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")
          FILTER = {
              "rates_filter[buyerType]": "RM",
              "rates_filter[mortgageType]": "repayment",
              "rates_filter[rateType]": "Fixed",
          }

          def report(tag, html):
              print("=" * 70)
              print(f"{tag}: {len(html):,} bytes")
              pcts = re.findall(r"\d+\.\d+\s*%", html)
              print(f"  percentages: {len(pcts)} -> {pcts[:10]}")
              print(f"  '<table' count: {html.lower().count('<table')}")
              for word in ("LTV", "APRC", "Fee Saver", "Standard"):
                  print(f"  contains {word!r}: {word.lower() in html.lower()}")
              try:
                  products, strategy = parse_products(html)
                  print(f"  PARSED OK via {strategy}: {len(products)} products")
                  for p in products[:12]:
                      print(f"    {p}")
              except ParseError as exc:
                  print(f"  parse failed: {exc}")

          # --- route 1: plain GET with the filter as query params
          try:
              url = f"{URL}?{urlencode(FILTER)}"
              print("GET", url)
              r = requests.get(url, timeout=30, headers={"User-Agent": UA,
                                                         "Accept-Language": "en-GB,en;q=0.9"})
              print("  status", r.status_code, "final url", r.url)
              report("plain GET with filter", r.text)
              pathlib.Path("filtered_get.html").write_text(r.text)
          except Exception as exc:
              print("plain GET failed:", type(exc).__name__, exc)

          # --- route 2: drive the form in a browser
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  page = browser.new_page(user_agent=UA, locale="en-GB")
                  page.goto(URL, wait_until="networkidle", timeout=60_000)

                  for btn in ("#consent_prompt_decline", "#consent_prompt_submit"):
                      el = page.query_selector(btn)
                      if el:
                          try:
                              el.click(timeout=5000)
                              print("clicked", btn)
                              break
                          except Exception:
                              pass

                  for name, value in FILTER.items():
                      page.select_option(f"select[name='{name}']", value)
                      print(f"selected {name} = {value}")

                  page.click("#rates_filter_submit")
                  page.wait_for_load_state("networkidle", timeout=60_000)
                  page.wait_for_timeout(3000)
                  print("url after submit:", page.url)

                  html = page.content()
                  pathlib.Path("filtered_browser.html").write_text(html)
                  report("browser, form submitted", html)
                  browser.close()
          except Exception as exc:
              print("browser route failed:", type(exc).__name__, exc)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filtered-html
          path: |
            filtered_get.html
            filtered_browser.html
          if-no-files-found: ignore
          retention-days: 7
