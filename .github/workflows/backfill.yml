name: Backfill from the Internet Archive

# A one-off. Run it once from the Actions tab, keep whatever it recovers, and
# let the daily job take over from there.

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: "Earliest year to look at (blank = as far back as the archive goes)"
        type: string
        default: "2023"
      limit:
        description: "Only the N most recent snapshots (blank = all). Each one is a page fetch."
        type: string
        default: "120"
      dry_run:
        description: "Report what it finds without writing anything"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: mortgage-rates

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recover past rates
        run: |
          python -m tracker backfill \
            ${{ inputs.from_year && format('--from-year {0}', inputs.from_year) || '' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            | tee backfill.log

      - name: Commit what was recovered
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "mortgage-rate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.csv docs/index.html
          if git diff --staged --quiet; then
            echo "Nothing recovered - no commit."
          else
            git commit -m "Backfill rates from the Internet Archive"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backfill-log
          path: backfill.log
          retention-days: 14
