name: Mortgage rates

on:
  schedule:
    # 07:15 UTC daily. GitHub only runs scheduled workflows from the default
    # branch, and may delay them by a few minutes when it is busy.
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scrape and print without committing or alerting"
        type: boolean
        default: false
      test_alert:
        description: "Send a fake alert to check notifications reach you, then stop"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mortgage-rates
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Used only if the plain fetch cannot see the rates (JS-rendered page).
          pip install playwright
          playwright install --with-deps chromium

      - name: Test the parser
        if: ${{ !inputs.test_alert }}
        run: python -m pytest tests -q

      - name: Send a test alert
        if: ${{ inputs.test_alert }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          python -m tracker test-alert \
            --chart-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Scrape today's rates
        if: ${{ !inputs.test_alert }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          python -m tracker run \
            --chart-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit the day's data and chart
        if: ${{ !inputs.dry_run && !inputs.test_alert }}
        run: |
          git config user.name "mortgage-rate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.csv docs/index.html
          if git diff --staged --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "Rates for $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Keep the page HTML for debugging a failed parse
        if: failure()
        run: python -m tracker save-html page.html || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: page-html
          path: page.html
          if-no-files-found: ignore
          retention-days: 7
